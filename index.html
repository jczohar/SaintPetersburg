</style><style>:root{--navy:#14305f;--purple:#5b2a86;--gold:#f2b92e;--gold2:#ffd76a;--red:#c8102e;--bg:#f3f0fa;--card:#fff;--ink:#1f2340;--mut:#6b6f8c;--line:#e3def2;--ok:#1e9e6a;--r:16px;--sh:0 4px 14px rgba(40,30,90,.12)}

.top .hb{background:rgba(255,255,255,.15);border:0;border-radius:11px;width:36px;height:36px;font-size:18px;cursor:pointer;position:relative}
.top .hb .dot{position:absolute;top:3px;left:3px;background:var(--red);width:9px;height:9px;border-radius:50%}
.hb.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* weather */
.wx{background:linear-gradient(180deg,#27427b,#3b3a8f);color:#fff;padding:8px 10px 10px}

.wx-now .ic{font-size:36px;line-height:1}.wx-now .tp{font-size:28px;font-weight:800;line-height:1}.wx-now small{display:block;font-size:11.5px;opacity:.9}
.wx-days{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px;scrollbar-width:none}
.wx-days::-webkit-scrollbar{display:none}
.wd{flex:none;min-width:58px;text-align:center;background:rgba(255,255,255,.14);border-radius:12px;padding:4px 4px;font-size:12px}
.wd.today{background:rgba(242,185,46,.35);outline:1.5px solid var(--gold2)}
.wd .ic{font-size:20px}.wd b{font-size:13px}
.wx-info{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 9px;font-size:12px}
.todaybtn{margin-inline-start:auto;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2600;border:0;font-weight:800;border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}

.tabs{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none;box-shadow:0 2px 6px rgba(40,30,90,.08)}

.btn.red{background:linear-gradient(135deg,#e0314b,var(--red))}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:9px}
.btn.ghost{background:#f1ecfb;color:var(--purple)}
.in,.sel,.ta{border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;width:100%;text-align:right}
.ta{min-height:64px;resize:vertical}
.in.l{direction:ltr;text-align:left}
.fl{display:flex;flex-direction:column;gap:3px;margin:6px 0}
.fl>label{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.cp{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.cp.on{background:var(--purple);color:#fff;border-color:var(--purple)}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin:9px 0;overflow:hidden;border:1px solid var(--line)}
.card .hd{display:flex;gap:10px;padding:9px;cursor:pointer}
.card .ph{width:92px;height:92px;flex:none;border-radius:13px;background:linear-gradient(135deg,#d8cdf5,#f6d98a);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card .tx{flex:1;min-width:0}
.card .nm{font-weight:800;font-size:16px;color:var(--navy);line-height:1.2}
.card .en{font-size:12.5px;color:var(--mut);direction:ltr;text-align:right}
.card .sh{font-size:13.5px;margin-top:3px}
.badge{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 8px;background:#efe7ff;color:var(--purple);margin-inline-end:4px}
.badge.g{background:#fff3cf;color:#7a5200}.badge.r{background:#ffe3e8;color:#a00a24}.badge.k{background:#dcf5e9;color:#0c6b44}
.card .bd{padding:0 11px 11px;border-top:1px dashed var(--line)}
.stars{display:inline-flex;gap:1px;cursor:pointer;font-size:20px;color:#d6d0e6}
.stars b{font-weight:400}.stars b.on{color:var(--gold)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:3px 8px;font-size:13.5px;margin:8px 0}
.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card.hid{opacity:.55}
.empty{text-align:center;color:var(--mut);padding:20px}
/* map */
.mapbox{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);background:#dfe8f0}
.map{height:56vh;min-height:320px;width:100%}
.mapbox.fs{position:fixed;inset:0;z-index:3000;border-radius:0}
.mapbox.fs .map{height:100%}
.mapbox .fsx{position:absolute;top:8px;left:8px;z-index:1000}
.mk{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid #fff;font-size:15px}
.mk span{transform:rotate(45deg)}
.mk.num{font-weight:800;font-size:13px}
.st{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid;box-shadow:0 0 0 1px #fff}
.st.tr{width:18px;height:18px;border-width:4px;background:#222}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:22px;height:7px;border-radius:4px}
.leaflet-popup-content{direction:rtl;text-align:right;min-width:170px}
.pimg{width:100%;height:90px;object-fit:cover;border-radius:8px;margin-bottom:4px;background:#eee}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,15,50,.55);z-index:4000;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:14px 14px 22px;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin-top:0}
.sheet .x{float:left;background:#f1ecfb;border:0;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border-radius:12px;padding:10px 16px;z-index:6000;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.lst{list-style:none;margin:0;padding:0}
.lst li{padding:9px 6px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;cursor:pointer}
.lst li:hover{background:#f6efff}
/* date field */
.df{position:relative;display:flex;gap:4px}
.df input{direction:ltr;text-align:right}
.df button{border:1.5px solid var(--line);background:#f6efff;border-radius:11px;width:42px;cursor:pointer;font-size:18px}
.cal{width:100%}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .gr b{font-size:12px;color:var(--mut)}
.cal .d{border:0;background:#f6f3fc;border-radius:9px;padding:9px 0;cursor:pointer}
.cal .d.sel{background:var(--purple);color:#fff}.cal .d.td{outline:2px solid var(--gold)}
.cal .d.off{visibility:hidden}
/* routes */
.day{border-inline-start:5px solid var(--gold);padding-inline-start:8px;margin:12px 0}
.stop{display:flex;gap:8px;padding:7px;background:#faf7ff;border-radius:12px;margin:6px 0;border:1px solid var(--line)}
.stop .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.leg{font-size:12.5px;color:var(--mut);margin:2px 6px 2px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.leg select{border:1px solid var(--line);border-radius:8px;padding:2px 4px;background:#fff}
.alert{border-radius:12px;padding:9px 11px;margin:7px 0;font-size:14px}
.alert.high{background:#ffe5e9;border-inline-start:5px solid var(--red)}
.alert.mid{background:#fff2d6;border-inline-start:5px solid var(--gold)}
.alert.low{background:#e6f1ff;border-inline-start:5px solid #3b7ddd}
table.tb{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
.tb th{background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;padding:7px;text-align:center}
.tb td{padding:7px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb td.ru{direction:ltr;text-align:left;font-size:15px;font-weight:600}
.tb td.pr{direction:ltr;text-align:left;color:var(--mut)}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:14px}
.big{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
@media print{.top,.wx,.tabs,.bar,.acts,.toast,.ov{display:none!important}body{background:#fff}.card{box-shadow:none}}
@media(min-width:720px){.ov{align-items:center}.sheet{border-radius:20px}}
.mapbox.fs iframe{height:100%!important}
.sel{appearance:auto}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--purple)}
.stop .en{direction:ltr;text-align:right;font-size:12px;color:var(--mut)}
.lst li.on{background:#f6efff}
.card .bd .acts a.btn{text-decoration:none}
.foot b{color:#b97c10}
.top .tt b{white-space:normal;font-size:14px;line-height:1.1}
.mapbox .fsx{left:auto;right:8px}
.chip .ltr,.chip bdi{direction:ltr;unicode-bidi:isolate}

async function drawRoute(from, to, mode) {
